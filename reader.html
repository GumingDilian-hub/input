<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWP Reader</title>
    <link rel="icon" type="image/png" href="images/0721.png?v=1">
    <link rel="stylesheet" href="css/style.css?v=7">
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <!-- Marked -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <style>
        /* 加载遮罩 */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid #555;
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #progress-text {
            margin-top: 1.2rem;
            color: #ccc;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <!-- 加载动画 -->
    <div id="loading-overlay">
        <div class="loader"></div>
        <div id="progress-text">少女祈祷中...</div>
    </div>

    <div id="app">
        <!-- 工具栏 -->
        <div id="toolbar">
            <button id="btn-home" class="toolbar-btn" onclick="location.href='index.html'">返回首页</button>
            <button id="btn-search" class="toolbar-btn" onclick="toggleSearchPanel()">搜索</button>
        </div>
        
        <!-- 搜索面板 -->
        <div id="search-panel" class="panel-hidden">
            <div class="panel-content">
                <button id="close-search" class="close-btn" onclick="toggleSearchPanel()">×</button>
                <input type="text" id="search-input" placeholder="输入关键词搜索...">
                <div id="search-results"></div>
                <!-- 自动跟随开关 -->
                <div class="auto-scroll-toggle">
                    <label>
                        <input type="checkbox" id="auto-scroll-checkbox" checked> 自动跟随滚动
                    </label>
                </div>
            </div>
        </div>
        
        <!-- 左侧目录 -->
        <div id="sidebar">
            <div class="sidebar-header">
                <span>导航 <span id="version-tag" style="font-size:0.7rem; color:#888; margin-left:0.3rem; cursor:default; user-select:none;">v5.068</span></span>
                <div>
                    <button onclick="expandAll()" title="全部展开">＋</button>
                    <button onclick="collapseAll()" title="全部折叠">－</button>
                </div>
            </div>
            <div style="padding: 0.5rem 1rem; background: #252525; border-bottom: 1px solid #444;">
                <select id="chapter-select" style="width: 100%; padding: 0.4rem; font-size: 0.9rem; background: #333; color: #ddd; border: 1px solid #555; border-radius: 4px;">
                    <option value="">— 快速跳转章节 —</option>
                </select>
            </div>
            <nav id="toc-tree"></nav>
        </div>
        
        <div id="resizer"></div>
        
        <main id="content">
            <div id="version-info"></div>
            <div id="article-body"></div>
        </main>
    </div>
    
    <script src="js/reader.js"></script>
    <script>
        function toggleSearchPanel() {
            var panel = document.getElementById('search-panel');
            if (panel.classList.contains('panel-visible')) {
                panel.classList.remove('panel-visible');
            } else {
                panel.classList.add('panel-visible');
            }
        }

        (function() {
            var versionTag = document.getElementById('version-tag');
            var clickCount = 0, firstClickTime = 0;
            versionTag.addEventListener('click', function(e) {
                e.stopPropagation();
                var now = Date.now();
                if (now - firstClickTime > 5000) { clickCount = 0; firstClickTime = now; }
                clickCount++;
                if (clickCount === 6) {
                    window.location.href = 'https://github.com/GumingDilian-hub/input';
                }
            });
        })();
    </script>
</body>
</html>
