<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWP Reader</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <!-- Marked -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- 工具栏（精简） -->
        <div id="toolbar">
            <button id="btn-home" class="toolbar-btn" onclick="location.href='index.html'">返回首页</button>
            <button id="btn-search" class="toolbar-btn">搜索</button>
        </div>
        
        <!-- 搜索面板 -->
        <div id="search-panel" class="panel-hidden">
            <div class="panel-content">
                <button id="close-search" class="close-btn">×</button>
                <input type="text" id="search-input" placeholder="输入关键词搜索...">
                <div id="search-results"></div>
            </div>
        </div>
        
        <!-- 左侧目录 -->
        <div id="sidebar">
            <div class="sidebar-header">
                <span>导航</span>
                <div>
                    <button id="expand-all" title="全部展开">＋</button>
                    <button id="collapse-all" title="全部折叠">－</button>
                </div>
            </div>
            <div style="padding: 0.5rem 1rem; background: #252525; border-bottom: 1px solid #444;">
                <select id="chapter-select" style="width: 100%; padding: 0.4rem; font-size: 0.9rem; background: #333; color: #ddd; border: 1px solid #555; border-radius: 4px;">
                    <option value="">— 快速跳转章节 —</option>
                </select>
            </div>
            <nav id="toc-tree"></nav>
        </div>
        
        <div id="resizer"></div>
        
        <main id="content">
            <div id="version-info"></div>
            <div id="article-body"></div>
        </main>
    </div>
    
    <script src="js/reader.js"></script>
</body>
</html>
