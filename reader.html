    <style>
        :root {
            --bg: #1e1e1e;
            --card-bg: #2d2d2d;
            --border: #444;
            --text: #fff;
            --subtext: #aaa;
            --btn-primary-bg: #fff;
            --btn-primary-text: #1e1e1e;
            --btn-secondary-bg: #3a3a3a;
            --btn-secondary-text: #fff;
            --footer-bg: #111;
            --footer-text: #888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .home-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .home-left {
            flex: 1;
            padding-right: 3rem;
            text-align: left;
        }

        .home-left h1 {
            font-size: 3.2rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .home-left p {
            font-size: 1.4rem;
            color: var(--subtext);
            margin-bottom: 2.5rem;
        }

        .btn-group {
            display: flex;
            gap: 1.2rem;
        }

        .btn {
            padding: 0.8rem 2.2rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--btn-primary-bg);
            color: var(--btn-primary-text);
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #ccc;
        }

        .btn-secondary {
            background: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            border: 1px solid #555;
        }

        .btn-secondary:hover {
            background: #4a4a4a;
        }

        .home-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .home-right img {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        .footer-bar {
            height: 36px;
            background: var(--footer-bg);
            color: var(--footer-text);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="home-container">
        <div class="home-left">
            <h1>IWP</h1>
            <p>Input wenben please · 请输入文本</p>
            <div class="btn-group">
                <a href="reader.html" class="btn btn-primary">开始阅读</a>
                <a href="converter.html" class="btn btn-secondary">转换器</a>
            </div>
        </div>
        <div class="home-right">
            <img src="images/000/cover.png" alt="Cover Image">
        </div>
    </div>
    <div class="footer-bar">
        WEB INFORMATION REPOSITORY : /input/  VERSION 1.2.0
    </div>
</body>
</html>
