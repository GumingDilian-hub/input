<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWP · 请输入文本</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #1e1e1e;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .home-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #2d2d2d;
            border: 1px solid #444;
            padding: 3rem 4rem;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .card h1 {
            font-size: 3.2rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }
        .card p {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 2.5rem;
        }
        .btn-group {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
        }
        .btn {
            padding: 0.8rem 2.2rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
        }
        .btn-primary {
            background: #fff;
            color: #1e1e1e;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #ccc;
        }
        .btn-secondary {
            background: #3a3a3a;
            color: #fff;
            border: 1px solid #555;
        }
        .btn-secondary:hover {
            background: #4a4a4a;
        }
        .footer-bar {
            height: 36px;
            background: #111;
            color: #888;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="home-container">
        <div class="card">
            <h1>IWP</h1>
            <p>Input wenben please · 请输入文本</p>
            <div class="btn-group">
                <a href="reader.html" class="btn btn-primary">开始阅读</a>
                <a href="converter.html" class="btn btn-secondary">转换器</a>
            </div>
        </div>
    </div>
    <div class="footer-bar">
        WEB INFORMATION REPOSITORY : /input/  VERSION 1.2.0
    </div>
