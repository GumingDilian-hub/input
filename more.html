<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User - IWP</title>
    <link rel="icon" type="image/png" href="images/0721.jpg?v=1">
    <link rel="stylesheet" href="css/style.css?v=7">
    <style>
        #content { max-width: 800px; }
        .profile-card { background:#f9f9f9; padding:2rem; border-radius:8px; text-align:center; border:1px solid #eee; }
        .profile-avatar { width:100px; height:100px; border-radius:50%; border:3px solid #ddd; margin-bottom:1rem; object-fit:cover; }
        .profile-name { font-size:1.8rem; color:#333; margin-bottom:.5rem; }
        .profile-meta { color:#666; font-size:.9rem; margin-bottom:1rem; }
        .honor-badge { background:#333; color:#fff; padding:2px 6px; border-radius:4px; font-size:.8rem; margin:0 2px; }
        .user-post-item { padding:1rem 0; border-bottom:1px solid #eee; cursor:pointer; transition:background .2s; }
        .user-post-item:hover { background:#fcfcfc; padding-left:.5rem; }
    </style>
</head>
<body>
<div id="app">
    <div id="toolbar"><button id="btn-home" class="toolbar-btn" onclick="location.href='index.html'">返回首页</button></div>
    <main id="content">
        <div id="hot-view" style="display:none;"><h1>全站热度榜</h1><div id="hot-list"></div></div>
        <div id="user-view">
            <div class="profile-card">
                <img id="u-avatar" class="profile-avatar" src="" alt="Avatar">
                <h2 id="u-name" class="profile-name"></h2>
                <div id="u-meta" class="profile-meta"></div>
                <div id="u-school" style="color:#888;margin-bottom:1rem;"></div>
            </div>
            <h3 style="margin-top:2rem;border-bottom:2px solid #333;padding-bottom:.5rem;">TA的文章</h3>
            <div id="u-posts"></div>
        </div>
    </main>
</div>
<script>
(function () {
    const API = 'https://copilot.2167964516.workers.dev';
    const esc = value => { const d=document.createElement('div'); d.textContent=value==null?'':String(value); return d.innerHTML; };

    async function get(path) {
        const r = await fetch(API + path);
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
        return data;
    }

    async function loadUser(username) {
        const data = await get('/users/' + encodeURIComponent(username));
        const u = data.user;
        document.getElementById('u-avatar').src = u.avatar || 'images/0721.png';
        document.getElementById('u-avatar').onerror = function(){ this.src='images/0721.png'; };
        document.getElementById('u-name').textContent = u.username;
        document.getElementById('u-school').textContent = u.school || '';
        const meta = document.getElementById('u-meta');
        meta.innerHTML = '';
        if (u.honor_year) { const b=document.createElement('span'); b.className='honor-badge'; b.textContent=u.honor_year; meta.appendChild(b); }
        if (u.honor_rank) { const b=document.createElement('span'); b.className='honor-badge'; b.textContent=u.honor_rank; meta.appendChild(b); }
        const posts = document.getElementById('u-posts');
        posts.innerHTML = '';
        (data.posts || []).forEach(p => {
            const div=document.createElement('div'); div.className='user-post-item';
            div.innerHTML='<h4>'+esc(p.title)+'</h4><small style="color:#999;">浏览: '+Number(p.views||0)+' · 评论: '+Number(p.comments_count||0)+'</small>';
            div.onclick=()=>location.href='blog.html?post='+encodeURIComponent(p.id);
            posts.appendChild(div);
        });
    }

    async function loadHotUsers() {
        const data=await get('/users/hot');
        const list=document.getElementById('hot-list'); list.innerHTML='';
        (data.users || []).forEach((u,i)=>{
            const div=document.createElement('div'); div.className='user-post-item';
            const row=document.createElement('div'); row.style.cssText='display:flex;align-items:center;';
            const rank=document.createElement('span'); rank.style.cssText='font-size:1.5rem;font-weight:bold;width:40px;color:#ccc;'; rank.textContent='#'+(i+1);
            const img=document.createElement('img'); img.src=u.avatar||'images/0721.png'; img.style.cssText='width:40px;height:40px;border-radius:50%;margin:0 15px;object-fit:cover;';
            const info=document.createElement('div'); info.style.flex='1'; info.innerHTML='<div style="font-weight:bold;color:#333;">'+esc(u.username)+'</div><div style="font-size:.8rem;color:#888;">'+esc((u.honor_year||'')+' '+(u.honor_rank||''))+'</div>';
            const heat=document.createElement('div'); heat.style.cssText='font-weight:bold;color:#d9534f;'; heat.textContent=Math.floor(Number(u.total_heat||0))+' 热度';
            row.append(rank,img,info,heat); div.appendChild(row); div.onclick=()=>location.href='more.html?user='+encodeURIComponent(u.username); list.appendChild(div);
        });
    }

    async function init() {
        const params=new URLSearchParams(location.search); const username=params.get('user'); const type=params.get('type');
        try {
            if(type==='hot'){ document.getElementById('user-view').style.display='none'; document.getElementById('hot-view').style.display='block'; await loadHotUsers(); }
            else if(username) await loadUser(username);
        } catch(e) { document.getElementById('content').insertAdjacentHTML('beforeend','<p style="color:#999;">加载失败：'+esc(e.message)+'</p>'); }
    }
    init();
})();
</script>
</body>
</html>
