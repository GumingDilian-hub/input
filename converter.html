<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWP 转换器</title>
    <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #1e1e1e;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            color: #ccc;
        }
        .header {
            background: #2d2d2d;
            color: #fff;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1rem;
            border-bottom: 1px solid #444;
        }
        .header a { color: #aaa; margin-left: auto; font-size: 0.85rem; text-decoration: none; }
        .toolbar {
            background: #252525;
            border-bottom: 1px solid #444;
            padding: 0.4rem 0.8rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            align-items: center;
        }
        .toolbar button, .toolbar select {
            padding: 0.25rem 0.6rem;
            font-size: 0.85rem;
            border: 1px solid #555;
            border-radius: 3px;
            background: #333;
            color: #ddd;
            cursor: pointer;
        }
        .toolbar button:hover { background: #444; border-color: #888; }
        .split-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .editor-wrapper { flex: 1; border-bottom: 2px solid #444; overflow-y: auto; }
        #editor {
            min-height: 100%;
            padding: 1rem;
            background: #fff;
            outline: none;
            font-size: 1rem;
            line-height: 1.7;
            color: #111;
        }
        .output-wrapper { flex: 1; display: flex; flex-direction: column; background: #111; }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 0.8rem;
            background: #1a1a1a;
            font-size: 0.85rem;
            color: #aaa;
        }
        .mode-btns button {
            padding: 0.15rem 0.6rem;
            font-size: 0.8rem;
            background: #333;
            border: 1px solid #555;
            color: #ccc;
            cursor: pointer;
            border-radius: 3px;
        }
        .mode-btns button.active-mode { background: #555; border-color: #888; color: #fff; }
        #output {
            flex: 1;
            padding: 0.8rem;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            overflow-y: auto;
            background: #111;
            color: #d4d4d4;
            border: none;
            outline: none;
        }
        .copy-btn { background: #444; border: none; padding: 0.2rem 0.8rem; color: white; border-radius: 3px; cursor: pointer; }
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index:100; }
        .modal-box { background: #2d2d2d; padding: 1.5rem; border-radius: 6px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 520px; max-height: 80vh; overflow-y: auto; color: #ddd; }
        .modal-box h3 { margin-bottom: 1rem; color: #fff; }
        .image-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
        .image-grid img { width: 100%; height: 80px; object-fit: cover; border-radius: 4px; border: 2px solid transparent; cursor: pointer; }
        .image-grid img:hover, .image-grid img.selected { border-color: #fff; }
        .path-hint { font-size: 0.7rem; word-break: break-all; text-align: center; color: #999; }
        .form-row { display: flex; gap: 1rem; margin-bottom: 0.8rem; }
        .form-row label { display: block; font-size: 0.85rem; margin-bottom: 0.2rem; color: #bbb; }
        .form-row input, .form-row select { padding: 0.4rem; border: 1px solid #555; border-radius: 3px; width: 100%; background: #1e1e1e; color: #ddd; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }
        .modal-buttons button { padding: 0.4rem 1.2rem; border: none; border-radius: 3px; cursor: pointer; }
        .btn-insert { background: #fff; color: #111; }
        .btn-insert:hover { background: #ccc; }
        .btn-cancel { background: #3a3a3a; color: #ddd; }
        #img-manual-toggle { margin-top: 0.5rem; font-size: 0.85rem; color: #569cd6; cursor: pointer; text-decoration: underline; }
        #manual-input-area { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <strong>IWP 转换器</strong>
        <span style="opacity:0.8;font-size:0.85rem;">富文本 ↔ Markdown / HTML</span>
        <a href="index.html">返回首页</a>
    </div>

    <div class="toolbar">
        <button data-cmd="bold"><b>B</b></button>
        <button data-cmd="italic"><i>I</i></button>
        <button data-cmd="underline"><u>U</u></button>
        <select id="heading-select">
            <option value="">正文</option>
            <option value="h1">标题 1</option>
            <option value="h2">标题 2</option>
            <option value="h3">标题 3</option>
        </select>
        <button id="btn-image">🖼 图片 (Ctrl+Shift+I)</button>
        <button id="btn-table">⊞ 表格</button>
        <input type="color" id="color-picker" value="#000000" title="文字颜色">
        <button id="btn-clear">✕ 清除格式</button>
    </div>

    <!-- 图片弹窗（不变） -->
    <div class="modal-overlay" id="image-modal">
        <div class="modal-box">
            <h3>插入图片</h3>
            <div id="gallery-section">
                <div class="image-grid" id="image-grid"></div>
                <div id="gallery-empty" style="color:#999;font-size:0.9rem;display:none;">⚠️ 未找到图片列表，请检查 data/images-list.json</div>
                <span id="img-manual-toggle" onclick="toggleManualInput()">或手动输入图片URL</span>
            </div>
            <div id="manual-input-area">
                <label>图片 URL 或相对路径</label>
                <input type="text" id="img-url" placeholder="例如 images/001/logo.png 或 https://...">
            </div>
            <div class="form-row" style="margin-top:0.8rem;">
                <div style="flex:1;">
                    <label>位置</label>
                    <select id="img-pos">
                        <option value="center">居中</option>
                        <option value="left">左侧环绕</option>
                        <option value="right">右侧环绕</option>
                        <option value="around">四周型</option>
                    </select>
                </div>
                <div style="flex:1;">
                    <label>宽度 (可选)</label>
                    <input type="text" id="img-width" placeholder="例如 300">
                </div>
            </div>
            <div class="form-row">
                <div style="flex:1;">
                    <label>图注 (可选)</label>
                    <input type="text" id="img-caption" placeholder="图片下方说明文字">
                </div>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeImageModal()">取消</button>
                <button class="btn-insert" id="img-insert-btn">插入</button>
            </div>
        </div>
    </div>

    <div class="split-pane">
        <div class="editor-wrapper">
            <div id="editor" contenteditable="true">
                <h1>元嘉草草封狼，居胥</h1>
                <p>请输入文本请输入文本</p>
            </div>
        </div>
        <div class="output-wrapper">
            <div class="output-header">
                <span>输出</span>
                <div style="display:flex;align-items:center;gap:0.5rem;">
                    <div class="mode-btns">
                        <button id="btn-md" class="active-mode">Markdown</button>
                        <button id="btn-html">HTML</button>
                    </div>
                    <button class="copy-btn" id="btn-copy">复制</button>
                </div>
            </div>
            <div id="output" contenteditable="false"></div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const outputDiv = document.getElementById('output');
        const turndownService = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });
        let currentMode = 'markdown', selectedImagePath = '';

        function updateOutput() {
            const html = editor.innerHTML;
            outputDiv.textContent = currentMode === 'html' ? html : turndownService.turndown(html);
        }
        new MutationObserver(updateOutput).observe(editor, { childList: true, subtree: true, characterData: true, attributes: true });
        editor.addEventListener('input', updateOutput);
        editor.addEventListener('paste', () => setTimeout(updateOutput, 10));

        document.querySelectorAll('[data-cmd]').forEach(btn => {
            btn.addEventListener('click', () => { document.execCommand(btn.dataset.cmd); editor.focus(); updateOutput(); });
        });
        document.getElementById('heading-select').addEventListener('change', function() {
            const v = this.value;
            if (v) { document.execCommand('formatBlock', false, v); this.selectedIndex = 0; editor.focus(); updateOutput(); }
        });
        document.getElementById('btn-table').addEventListener('click', () => {
            const rows = prompt('行数:', 3), cols = prompt('列数:', 3);
            if (rows && cols) {
                let t = '<table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse;">';
                for (let i=0;i<parseInt(rows);i++) { t+='<tr>'; for(let j=0;j<parseInt(cols);j++) t+='<td>内容</td>'; t+='</tr>'; }
                t+='</table>';
                document.execCommand('insertHTML', false, t);
                editor.focus(); updateOutput();
            }
        });
        document.getElementById('color-picker').addEventListener('input', function() {
            document.execCommand('foreColor', false, this.value);
            editor.focus(); updateOutput();
        });
        document.getElementById('btn-clear').addEventListener('click', () => { document.execCommand('removeFormat'); editor.focus(); updateOutput(); });

        const imgModal = document.getElementById('image-modal'), imgGrid = document.getElementById('image-grid');
        const galleryEmpty = document.getElementById('gallery-empty'), manualToggle = document.getElementById('img-manual-toggle');
        const manualArea = document.getElementById('manual-input-area'), imgUrlInput = document.getElementById('img-url');
        const imgPos = document.getElementById('img-pos'), imgWidth = document.getElementById('img-width'), imgCaption = document.getElementById('img-caption');

        async function loadImageList() {
            try {
                const resp = await fetch('data/images-list.json');
                if (!resp.ok) throw new Error('Not found');
                renderImageGrid(await resp.json());
            } catch {
                galleryEmpty.style.display = 'block';
                imgGrid.innerHTML = '';
                toggleManualInput(true);
            }
        }
        function renderImageGrid(paths) {
            imgGrid.innerHTML = '';
            galleryEmpty.style.display = 'none';
            paths.forEach(path => {
                const wrapper = document.createElement('div');
                const img = document.createElement('img'); img.src = path; img.alt = path; img.title = path;
                img.addEventListener('click', () => {
                    document.querySelectorAll('.image-grid img.selected').forEach(i => i.classList.remove('selected'));
                    img.classList.add('selected');
                    selectedImagePath = path;
                    imgUrlInput.value = '';
                });
                wrapper.appendChild(img);
                const hint = document.createElement('div'); hint.className = 'path-hint'; hint.textContent = path.split('/').slice(-1)[0]; wrapper.appendChild(hint);
                imgGrid.appendChild(wrapper);
            });
        }
        function toggleManualInput(forceShow = false) {
            if (forceShow || manualArea.style.display === 'none') { manualArea.style.display = 'block'; manualToggle.textContent = '返回图片浏览'; selectedImagePath = ''; }
            else { manualArea.style.display = 'none'; manualToggle.textContent = '或手动输入图片URL'; if (imgGrid.children.length === 0) loadImageList(); }
        }
        window.toggleManualInput = toggleManualInput;
        function openImageModal() {
            selectedImagePath = ''; imgUrlInput.value = ''; imgPos.value = 'center'; imgWidth.value = ''; imgCaption.value = '';
            manualArea.style.display = 'none'; manualToggle.textContent = '或手动输入图片URL';
            document.querySelectorAll('.image-grid img.selected').forEach(i => i.classList.remove('selected'));
            imgModal.style.display = 'flex';
            if (imgGrid.children.length === 0 && galleryEmpty.style.display === 'none') loadImageList();
        }
        function closeImageModal() { imgModal.style.display = 'none'; }
        document.getElementById('btn-image').addEventListener('click', openImageModal);
        document.querySelector('.btn-cancel').addEventListener('click', closeImageModal);
        imgModal.addEventListener('click', (e) => { if (e.target === imgModal) closeImageModal(); });

        document.getElementById('img-insert-btn').addEventListener('click', () => {
            const manualUrl = imgUrlInput.value.trim();
            let finalPath = selectedImagePath || manualUrl;
            if (!finalPath) { alert('请选择图片'); return; }
            const pos = imgPos.value, width = imgWidth.value.trim(), caption = imgCaption.value.trim();
            let markdown = '';
            if (caption) markdown = `:::image ${pos} ${finalPath} ${caption} :::`;
            else {
                let alt = pos === 'center' ? '' : `{${pos}}`;
                if (width) alt += ` width=${width}`;
                markdown = `![${alt}](${finalPath})`;
            }
            if (caption) {
                const textNode = document.createTextNode(markdown);
                const selection = window.getSelection();
                if (selection.rangeCount) { const range = selection.getRangeAt(0); range.deleteContents(); range.insertNode(textNode); range.collapse(false); }
                else editor.appendChild(textNode);
            } else {
                let style = width ? `width:${width}px;` : '';
                let altAttr = pos === 'center' ? '' : `{${pos}}${width ? ` width=${width}` : ''}`;
                const imgHtml = `<img src="${finalPath}" alt="${altAttr}" style="${style}">`;
                document.execCommand('insertHTML', false, imgHtml);
            }
            editor.focus(); updateOutput(); closeImageModal();
        });

        editor.addEventListener('keydown', (e) => { if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); openImageModal(); } });
        document.getElementById('btn-md').addEventListener('click', () => { currentMode = 'markdown'; document.getElementById('btn-md').classList.add('active-mode'); document.getElementById('btn-html').classList.remove('active-mode'); updateOutput(); });
        document.getElementById('btn-html').addEventListener('click', () => { currentMode = 'html'; document.getElementById('btn-html').classList.add('active-mode'); document.getElementById('btn-md').classList.remove('active-mode'); updateOutput(); });
        document.getElementById('btn-copy').addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(outputDiv.textContent); alert('已复制'); } catch { alert('复制失败'); }
        });
        updateOutput();
    </script>
</body>
</html>
