<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWP Blog</title>
    <link rel="icon" type="image/png" href="images/0721.jpg?v=1">
    <link rel="stylesheet" href="css/style.css?v=7">

    <!-- Marked -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        /* ===== 按钮黑底白字（覆盖所有带描边的按钮） ===== */
        button,
        .toolbar-btn,
        #btn-write,
        #btn-home,
        #btn-like-post,
        #btn-next-post,
        .comment-actions button,
        #blog-auth-panel button,
        #editor-panel .close-btn,
        .editor-tool-btn {
            background: #000 !important;
            color: #fff !important;
            border: 1px solid #333 !important;
            border-radius: 4px !important;
            padding: 6px 14px !important;
            cursor: pointer !important;
            transition: background 0.2s !important;
        }

        button:hover,
        .toolbar-btn:hover,
        #btn-write:hover,
        #btn-home:hover,
        #btn-like-post:hover,
        #btn-next-post:hover,
        .comment-actions button:hover,
        #blog-auth-panel button:hover,
        .editor-tool-btn:hover {
            background: #222 !important;
            border-color: #555 !important;
        }

        /* ===== 删除按钮 ===== */
        .delete-btn {
            background: #000 !important;
            color: #aaa !important;
            border: 1px solid #444 !important;
            border-radius: 4px !important;
            padding: 3px 8px !important;
            cursor: pointer !important;
            font-size: 0.8rem !important;
        }

        .delete-btn:hover {
            background: #222 !important;
            color: #fff !important;
            border-color: #666 !important;
        }

        /* 编辑器关闭按钮保持透明背景，但文字白色 */
        #editor-panel .close-btn {
            background: transparent !important;
            border: none !important;
            font-size: 1.5rem !important;
            padding: 0 8px !important;
        }

        #editor-panel .close-btn:hover {
            background: transparent !important;
            color: #aaa !important;
        }

        /* 输入框统一深色 */
        input[type="text"],
        input[type="password"],
        textarea {
            background: #1a1a1a !important;
            color: #ddd !important;
            border: 1px solid #444 !important;
            border-radius: 4px !important;
            padding: 6px 10px !important;
        }

        input:focus,
        textarea:focus {
            border-color: #888 !important;
            outline: none !important;
        }

        /* 文章列表和阅读区深色背景 */
        #posts-container,
        #article-container,
        .comment-section {
            background: #1e1e1e !important;
            color: #ddd !important;
        }

        #posts-container h2 {
            color: #eee !important;
        }

        .article-body h1,
        .article-body h2,
        .article-body h3 {
            color: #eee !important;
        }

        .article-body p {
            color: #ccc !important;
        }

        .comment-item {
            border-bottom: 1px solid #333 !important;
        }

        .comment-user {
            color: #eee !important;
        }

        .comment-time {
            color: #888 !important;
        }

        #post-stats {
            color: #aaa !important;
        }

        a {
            color: #88b4e6 !important;
        }

        /* 删除所有 emoji 后的文字替换（已在 html 中处理） */

        /* 个人中心面板样式（和 profile.js 配套） */
        #profile-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 420px;
            height: 100%;
            background: #1e1e1e;
            border-left: 1px solid #444;
            z-index: 10000;
            display: none;
            padding: 20px;
            overflow-y: auto;
        }

        #profile-panel .close-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 8px;
        }

        #profile-panel .close-btn:hover {
            color: #aaa;
        }

        #profile-content input[type="text"],
        #profile-content input[type="password"] {
            background: #111;
            color: #ddd;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 6px 10px;
            width: 100%;
        }

        #profile-content button {
            background: #000;
            color: #fff;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 8px 20px;
            cursor: pointer;
        }

        #profile-content button:hover {
            background: #222;
        }

        #toolbar .toolbar-btn#btn-profile {
            margin-left: auto;
        }
    </style>
</head>

<body>
    <div id="app">

        <!-- 工具栏（新增个人中心按钮） -->
        <div id="toolbar" style="background: #2a2a2a; border-bottom: 1px solid #444; padding: 8px 16px;">
            <button id="btn-home" class="toolbar-btn" onclick="location.href='index.html'">返回首页</button>
            <button id="btn-write" class="toolbar-btn" onclick="blogApp.openEditor()">发文</button>
            <button id="btn-profile" class="toolbar-btn" onclick="openProfile()">个人中心</button>
        </div>

        <!-- 内容区（无侧边栏，占满） -->
        <main id="content" style="margin-left: 0; width: 100%; padding: 20px;">

            <!-- 视图1：文章列表 -->
            <div id="blog-list-view">

                <div style="margin-bottom: 2rem; border-bottom: 1px solid #444; padding-bottom: 1rem;">
                    <input
                        type="text"
                        id="blog-search"
                        placeholder="搜索文章..."
                        style="width: 200px;"
                    >

                    <button onclick="blogApp.fetchPosts()">搜索</button>

                    <span style="margin: 0 10px; color: #888;">|</span>

                    <a
                        href="more.html?type=hot"
                        target="_blank"
                        style="color: #88b4e6; text-decoration: none;"
                    >
                        热度榜
                    </a>
                </div>

                <div id="posts-container">
                    <!-- 动态渲染 -->
                </div>
            </div>

            <!-- 视图2：文章阅读 -->
            <div id="blog-read-view" style="display: none;">

                <button
                    onclick="blogApp.backToList()"
                    style="margin-bottom: 1rem;"
                >
                    ← 返回列表
                </button>

                <div id="article-container"></div>

                <div
                    class="post-actions"
                    style="margin: 2rem 0; border-top: 1px solid #444; padding-top: 1rem;"
                >
                    <button
                        id="btn-like-post"
                        class="toolbar-btn"
                    >
                        点赞
                    </button>

                    <span
                        style="margin-left: 10px; color: #aaa;"
                        id="post-stats"
                    ></span>

                    <button
                        id="btn-next-post"
                        style="float: right;"
                    >
                        下一篇 →
                    </button>
                </div>

                <!-- 评论区 -->
                <div
                    id="blog-comments-area"
                    class="comment-section"
                    style="display: none;"
                >

                    <div
                        class="comment-toggle"
                        onclick="document.getElementById('blog-comments-body').style.display = document.getElementById('blog-comments-body').style.display==='none'?'block':'none'"
                    >
                        来喵两句～
                        <span id="blog-comment-count"></span>
                    </div>

                    <div
                        id="blog-comments-body"
                        class="comment-body"
                        style="display: none;"
                    >

                        <div
                            id="blog-comment-list"
                            class="comment-list"
                        ></div>

                        <div
                            id="blog-comment-form"
                            class="comment-form"
                        >

                            <div
                                id="blog-auth-panel"
                                class="auth-panel"
                            ></div>

                            <div
                                id="blog-input-area"
                                class="input-area"
                                style="display: none;"
                            >
                                <textarea
                                    id="blog-comment-input"
                                    rows="3"
                                ></textarea>

                                <button onclick="blogApp.submitComment()">
                                    发表
                                </button>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 编辑器面板（初始隐藏） -->
    <div
        id="editor-panel"
        style="position: fixed; top: 0; right: 0; width: 500px; height: 100%; background: #1e1e1e; border-left: 1px solid #444; z-index: 1000; display: none; padding: 20px; overflow-y: auto;"
    >

        <div
            style="display:flex; justify-content:space-between; margin-bottom:1rem; border-bottom:1px solid #444; padding-bottom:0.5rem;"
        >
            <span style="font-weight:600; color:#fff;">
                新文章
            </span>

            <button
                class="close-btn"
                onclick="blogApp.closeEditor()"
                style="background:transparent; border:none; color:#fff; font-size:1.5rem; cursor:pointer;"
            >
                ×
            </button>
        </div>

        <input
            type="text"
            id="editor-title"
            placeholder="标题"
            style="width:100%; padding:0.8rem; margin-bottom:1rem; background:#111; border:1px solid #444; color:#fff; border-radius:4px;"
        >

        <div
            style="margin-bottom:0.5rem; display:flex; gap:0.5rem;"
        >
            <button
                class="editor-tool-btn"
                onclick="editor.insert('**','**')"
            >
                B
            </button>

            <button
                class="editor-tool-btn"
                onclick="editor.insert('*','*')"
            >
                I
            </button>

            <button
                class="editor-tool-btn"
                onclick="editor.insertTable()"
            >
                Table
            </button>

            <button
                class="editor-tool-btn"
                onclick="editor.insert('`','`')"
            >
                Code
            </button>
        </div>

        <textarea
            id="editor-content"
            style="width:100%; background:#111; color:#ccc; border:1px solid #444; padding:1rem; font-family:monospace; resize:vertical; min-height:400px; border-radius:4px;"
            placeholder="支持 Markdown..."
        ></textarea>

        <div
            style="margin-top:1rem; text-align:right;"
        >
            <button
                onclick="blogApp.submitPost()"
                style="padding:0.6rem 1.5rem;"
            >
                发布
            </button>
        </div>
    </div>

    <!-- 个人中心面板 -->
    <div id="profile-panel">

        <div
            style="display:flex; justify-content:space-between; margin-bottom:1.5rem; border-bottom:1px solid #444; padding-bottom:0.5rem;"
        >
            <span
                style="font-weight:600; color:#fff; font-size:1.2rem;"
            >
                个人中心
            </span>

            <button
                class="close-btn"
                onclick="closeProfile()"
            >
                ×
            </button>
        </div>

        <div id="profile-content">
            <div
                style="color:#888; text-align:center; padding:2rem 0;"
            >
                加载中...
            </div>
        </div>
    </div>

    <script src="js/editor.js"></script>
    <script src="js/blog.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
